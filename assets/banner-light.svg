    <text x="932" y="164" font-size="11" fill="#5B6B7A">spring boot</text>

    <rect x="1028.5" y="64.5" width="107" height="35" rx="8" fill="#FFFFFF" stroke="#DCE2E8"/>
    <text x="1082" y="87" fill="#14202B">postgres</text>

    <rect x="1028.5" y="132.5" width="107" height="35" rx="8" fill="#FFFFFF" stroke="#DCE2E8"/>
    <text x="1082" y="155" fill="#14202B">redis</text>

    <rect x="1028.5" y="200.5" width="107" height="35" rx="8" fill="#FFFFFF" stroke="#DCE2E8"/>
    <text x="1082" y="223" fill="#14202B">rabbitmq</text>
