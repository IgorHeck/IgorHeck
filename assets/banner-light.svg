<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t">
  <title id="t">Igor Henrique Heck · Desenvolvedor Backend Java · Spring Boot</title>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#DCE2E8"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect x="660" y="0" width="540" height="300" fill="url(#fade)"/></mask>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="#F7F8FA" stroke="#DCE2E8"/>
  <rect x="660" y="16" width="524" height="268" fill="url(#dots)" mask="url(#m)"/>

  <!-- texto -->
  <rect x="64" y="64" width="48" height="4" rx="2" fill="#0F6E73"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="64" y="138" font-size="64" font-weight="700" fill="#14202B" letter-spacing="-1">Igor Henrique Heck</text>
    <text x="64" y="186" font-size="28" font-weight="500" fill="#0F6E73">Desenvolvedor Backend Java · Spring Boot</text>
    <text x="64" y="228" font-size="20" fill="#5B6B7A">Criciúma, SC · aberto a vagas de desenvolvimento backend</text>
  </g>

  <!-- mini diagrama de arquitetura: cliente → API → dados e mensageria -->
  <g fill="none" stroke="#5B6B7A" stroke-width="1.5">
    <path d="M832 150 H880"/>
    <path d="M984 150 C1006 150 1006 82 1028 82"/>
    <path d="M984 150 H1028"/>
    <path d="M984 150 C1006 150 1006 218 1028 218"/>
  </g>
  <g fill="#0F6E73">
    <circle cx="880" cy="150" r="3"/>
    <circle cx="1028" cy="82" r="3"/>
    <circle cx="1028" cy="150" r="3"/>
    <circle cx="1028" cy="218" r="3"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" text-anchor="middle">
    <text x="856" y="140" font-size="11" fill="#5B6B7A">REST</text>

    <rect x="736.5" y="132.5" width="95" height="35" rx="8" fill="#FFFFFF" stroke="#DCE2E8"/>
    <text x="784" y="155" fill="#14202B">client</text>

    <rect x="880.5" y="126.5" width="103" height="47" rx="10" fill="#E3F1F1" stroke="#0F6E73" stroke-width="1.5"/>
